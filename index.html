  }

  }

  .logo {
    position: absolute;
    top: var(--pad);
    left: var(--pad);
    width: 190px;
  }

  /* ---------- page ---------- */

  main { padding: calc(var(--pad) + 66px) var(--pad) calc(var(--pad) + 40px); }
  .wrap { width: min(880px, 100%); margin: 0 auto; }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .title {
    margin: 0 0 clamp(22px, 3vw, 34px);
    font-size: clamp(21px, 2.7vw, 31px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.2;
  }

  .sheets { display: flex; flex-direction: column; gap: clamp(48px, 7vw, 72px); }

  /* ---------- download ---------- */

  .allbox { margin: clamp(26px, 4vw, 44px) 0 0; }
  .act {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 22px 28px;
    border: 0;
    border-radius: 12px;
    background: var(--gold);
    color: #08182f;
    font: 600 14px var(--font);
    letter-spacing: .04em;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    box-shadow: 0 10px 26px rgba(0,0,0,.32);
  }
  .act:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 16px 34px rgba(0,0,0,.4); }
  .act:disabled { cursor: default; opacity: .34; box-shadow: none; }
  .act svg { flex: none; }
  .hint {
    min-height: 18px;
    margin: 12px 0 0;
    text-align: center;
    font-size: 12.5px;
    color: var(--mist);
  }

  /* ---------- worksheet ---------- */

  .sheet {
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 12px;
    padding: clamp(26px, 4vw, 44px) clamp(22px, 4vw, 48px) clamp(30px, 4vw, 48px);
    box-shadow: 0 16px 40px rgba(2, 10, 28, .42);
  }
  .sheet .quote {
    margin: 0;
    font-size: clamp(15px, 1.9vw, 18px);
    font-style: italic;
    font-weight: 600;
    line-height: 1.45;
    color: #14181f;
  }
  .sheet .rule {
    margin: 6px 0 0;
    font-size: 10.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6b7480;
  }
  .sheet .blocks { margin-top: clamp(24px, 3vw, 36px); display: flex; flex-direction: column; gap: clamp(30px, 3.8vw, 42px); }
  .sheet .blocks:first-child { margin-top: 0; }

  .blk h3 {
    margin: 0 0 14px;
    font-size: clamp(16px, 2vw, 19px);
    font-weight: 600;
    color: var(--paper-blue);
    line-height: 1.3;
  }

  .lines { display: flex; flex-direction: column; gap: 10px; }
  .line { display: flex; align-items: baseline; gap: 12px; }
  .line span {
    flex: none;
    width: 26px;
    font-size: 15px;
    color: #7a8593;
    font-variant-numeric: tabular-nums;
  }

  input.f, textarea.f {
    width: 100%;
    font: 400 15px var(--font);
    color: var(--paper-ink);
    background: transparent;
    border: 0;
    outline: none;
  }
  input.f {
    border-bottom: 1.5px solid var(--paper-rule);
    padding: 7px 4px;
    border-radius: 0;
    transition: border-color .16s ease;
  }
  input.f:focus { border-bottom-color: var(--paper-blue); }
  input.f::placeholder, textarea.f::placeholder { color: #aab4c2; }

  textarea.f {
    display: block;
    resize: none;
    overflow: hidden;
    background: var(--paper-soft);
    border: 1px solid #dfe6f0;
    border-radius: 8px;
    padding: 14px 16px;
    line-height: 1.6;
    transition: border-color .16s ease;
  }
  textarea.f:focus { border-color: var(--paper-blue); }

  .split { display: flex; gap: 40px; }
  .split > div { flex: 1; min-width: 0; }

  .inline-q { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .inline-q h3 { margin: 0; }
  .inline-q input.f { width: auto; flex: 1 1 220px; min-width: 180px; }

  .callout {
    border: 5px solid var(--gold);
    border-radius: 6px;
    padding: 14px;
    background: var(--gold);
  }
  .callout h4 {
    margin: 0 0 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: #14181f;
  }
  .callout .inner { background: #fff; border-radius: 3px; padding: 10px 12px; }
  .callout input.f {
    border-bottom: 0;
    padding: 6px 4px;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
  }
  .callout input.f::placeholder { font-size: 14px; font-weight: 400; }

  .notebox {
    border: 5px solid var(--gold);
    border-radius: 6px;
    background: var(--gold);
    padding: 6px;
  }
  .notebox p {
    margin: 0;
    background: #fff;
    border-radius: 3px;
    padding: 14px 18px;
    text-align: center;
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.5;
  }

  /* ---------- rating ---------- */

  .rate .scale {
    display: flex;
    justify-content: space-between;
    width: 214px;
    margin: 0 0 8px auto;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #8a94a2;
  }
  .rrow {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 0;
    border-top: 1px solid #e8edf4;
  }
  .rrow:last-child { border-bottom: 1px solid #e8edf4; }
  .rname { flex: 1; min-width: 0; }
  .rname b { display: block; font-size: 15px; font-weight: 600; color: #14181f; line-height: 1.35; }
  .rbtns { flex: none; display: flex; gap: 6px; }
  .rbtns button {
    width: 38px;
    height: 38px;
    padding: 0;
    border: 1.5px solid var(--paper-rule);
    border-radius: 8px;
    background: #fff;
    color: #7a8593;
    font: 500 14px var(--font);
    cursor: pointer;
    transition: border-color .14s ease, background .14s ease, color .14s ease;
  }
  .rbtns button:hover { border-color: var(--paper-blue); color: var(--paper-blue); }
  .rbtns button[aria-pressed="true"] {
    background: var(--paper-blue);
    border-color: var(--paper-blue);
    color: #fff;
    font-weight: 600;
  }
  .rrow.top .rbtns button[aria-pressed="true"] {
    background: var(--gold);
    border-color: var(--gold);
    color: #08182f;
  }

  /* ---------- print sheets (used for the PDF only) ---------- */

  #printroot {
    position: fixed;
    left: -20000px;
    top: 0;
    width: 816px;
    background: #fff;
  }
  /* One sheet = one letter page (816 x 1080 at the PDF's margins). The writing
     boxes and the space between blocks share whatever room is left, so short
     pages spread out instead of bunching at the top. */
  .psheet {
    width: 816px;
    min-height: 1080px;
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #1c1c1c;
    padding: 56px 64px 52px;
    font-family: var(--font);
  }
  .psheet .pmark { flex: none; width: 190px; aspect-ratio: 520/61; margin-bottom: 34px; }
  .psheet .pq { margin: 0; font: italic 600 17px var(--font); line-height: 1.45; }
  .psheet .pr { margin: 6px 0 0; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #6b7480; }
  .psheet .pq + .pbody, .psheet .pr + .pbody { margin-top: 30px; }
  .psheet .pbody { flex: 1; display: flex; flex-direction: column; gap: 30px; }
  .psheet .psp { flex: 1 1 0; margin: -15px 0; }
  .psheet .pgrow { flex: 3 0 auto; display: flex; flex-direction: column; }
  .psheet .pgrow .ptext { flex: 1 0 auto; }
  .psheet h3 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: #2e6db4; }
  .psheet .pline { display: flex; gap: 10px; align-items: baseline; margin: 0 0 12px; }
  .psheet .pline b { flex: none; width: 24px; font-weight: 400; color: #7a8593; font-size: 14px; }
  .psheet .pline u { flex: 1; text-decoration: none; border-bottom: 1.5px solid #c9d4e4; padding-bottom: 4px; font-size: 14px; min-height: 22px; display: block; }
  .psheet .ptext {
    border: 1px solid #dfe6f0; background: #f7f9fc; border-radius: 6px;
    padding: 12px 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;
    min-height: 54px;
  }
  .psheet .ptitle { flex: none; margin: 0 0 30px; font-size: 27px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; color: #04122c; }
  .psheet .pcall { border: 5px solid #fab040; background: #fab040; border-radius: 6px; padding: 6px; }
  .psheet .pcall h4 { margin: 0 0 6px; text-align: center; font-size: 14px; }
  .psheet .pcall .pin { background: #fff; border-radius: 3px; padding: 10px 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; min-height: 44px; }
  .psheet .pgrid { display: flex; gap: 40px; }
  .psheet .pgrid > div { flex: 1; }
  .psheet .pgrid .pline:last-child { margin-bottom: 0; }
  .psheet .pscale { display: flex; justify-content: space-between; width: 150px; margin: 0 0 6px auto; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: #8a94a2; }
  .psheet .prow { display: flex; align-items: center; gap: 18px; padding: 9px 0; border-top: 1px solid #e8edf4; }
  .psheet .prow:last-child { border-bottom: 1px solid #e8edf4; }
  .psheet .prow .pn { flex: 1; }
  .psheet .prow .pn b { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .psheet .pbx { flex: none; display: flex; gap: 5px; }
  .psheet .pbx span {
    display: block; width: 26px; height: 26px; border: 1.5px solid #c9d4e4; border-radius: 6px;
    text-align: center; line-height: 23px; font-size: 12px; color: #7a8593;
  }
  .psheet .pbx span.on  { background: #2e6db4; border-color: #2e6db4; color: #fff; font-weight: 600; }
  .psheet .pbx span.top { background: #fab040; border-color: #fab040; color: #08182f; font-weight: 600; }

  @media (max-width: 620px) {
    .logo { width: 148px; }
    .split { flex-direction: column; gap: 24px; }
    .rate .scale { width: 100%; margin-left: 0; }
    .rrow { flex-direction: column; align-items: stretch; gap: 10px; }
    .rbtns button { flex: 1; width: auto; height: 42px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

  /* ------------------------------------------------------------------
     The worksheet. Each page is a big title (title:) over one white sheet.
     Block types:
       num     numbered lines           { t, k, label, n }
       split   two numbered columns     { t, k, cols: [[key, heading, lines], ...] }
       inline  one line next to a label { t, k, label }
       note    gold box, no field       { t, text }
       prompt  writing box              { t, k, label, rows }
       rate    1-5 rating rows          { t, k, items: [name, ...] }  (label optional)
       callout gold box with one line   { t, k, label }  (auto-fills from the rating)
     To put a quote at the top of a page, add rule:"..." (and rn: for the
     "Sandler Rule #" line under it).
     ------------------------------------------------------------------ */

  const PAGES = [
    { id:"pg1", title:"The Buyer/Seller Dance",
      blocks:[
        { t:"split", k:"proc", cols:[["seller", "Seller’s Process", 5], ["buyer", "Buyer’s Process", 4]] },
        { t:"note", text:"“You are paying for the sins of the salespeople that came before you.”" },
        { t:"prompt", k:"mine", label:"Where I see this with my own prospects:", rows:4 }
      ]},
    { id:"pg2", title:"Six Hidden Weaknesses",
      blocks:[
        { t:"rate", k:"rate", items:[
          "Need for Approval",
          "Stays in the Moment / Emotional Involvement",
          "Head Trash (Unsupportive Beliefs)",
          "Uncomfortable Discussing Money",
          "Unsupportive Buy Cycle",
          "Handles Rejection"
        ]},
        { t:"callout", k:"one", label:"The one I need to work on:" },
        { t:"prompt", k:"sounds", label:"When it shows up, it sounds like:", rows:3 },
        { t:"prompt", k:"next",   label:"What I’ll do differently this week:", rows:3 }
      ]}
  ];

  /* ---------- helpers ---------- */

  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  };

  let ANSWERS = {};
  function loadAnswers() {
    try { ANSWERS = JSON.parse(localStorage.getItem(WB) || "{}") || {}; }
    catch (e) { ANSWERS = {}; }
  }
  let saveTimer = null;
  function saveAnswers() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(WB, JSON.stringify(ANSWERS)); } catch (e) {}
    }, 250);
  }
  const val = function (k) { return ANSWERS[k] || ""; };

  /* the rating block and the callout it fills */
  function rateBlock() {
    for (const p of PAGES) for (const b of p.blocks) if (b.t === "rate") return { page: p, b: b };
    return null;
  }
  function calloutKey() {
    for (const p of PAGES) for (const b of p.blocks) if (b.t === "callout") return p.id + "." + b.k;
    return null;
  }

  /* Highest-rated weakness. names has more than one entry on a tie. */
  function topRated() {
    const r = rateBlock();
    if (!r) return { max: 0, idx: [], names: [] };
    let max = 0;
    const scores = r.b.items.map(function (_, i) {
      const v = Number(val(r.page.id + "." + r.b.k + "." + (i + 1))) || 0;
      if (v > max) max = v;
      return v;
    });
    const idx = [];
    scores.forEach(function (v, i) { if (max && v === max) idx.push(i); });
    return { max: max, idx: idx, names: idx.map(function (i) { return r.b.items[i]; }) };
  }

  /* ---------- screen ---------- */

  function field(k, ph) {
    return '<input class="f" type="text" data-fk="' + k + '" value="' + esc(val(k)) +
           '" placeholder="' + esc(ph || "") + '" autocomplete="off" spellcheck="true">';
  }
  function area(k, rows) {
    const r = rows || 3;
    return '<textarea class="f" rows="' + r + '" style="min-height:' + (r * 26 + 30) +
           'px" data-fk="' + k + '">' + esc(val(k)) + "</textarea>";
  }
  function numLines(base, n) {
    let li = "";
    for (let i = 1; i <= n; i++) li += '<div class="line"><span>' + i + ".)</span>" + field(base + "." + i) + "</div>";
    return '<div class="lines">' + li + "</div>";
  }

  function blockHTML(page, b) {
    const base = page.id + "." + b.k;

    if (b.t === "num") {
      return '<div class="blk"><h3>' + esc(b.label) + "</h3>" + numLines(base, b.n) + "</div>";
    }
    if (b.t === "split") {
      return '<div class="blk split">' + b.cols.map(function (c) {
        return "<div><h3>" + esc(c[1]) + "</h3>" + numLines(base + "." + c[0], c[2]) + "</div>";
      }).join("") + "</div>";
    }
    if (b.t === "inline") {
      return '<div class="blk inline-q"><h3>' + esc(b.label) + "</h3>" + field(base) + "</div>";
    }
    if (b.t === "note") {
      return '<div class="blk"><div class="notebox"><p>' + esc(b.text) + "</p></div></div>";
    }
    if (b.t === "prompt") {
      return '<div class="blk"><h3>' + esc(b.label) + "</h3>" + area(base, b.rows) + "</div>";
    }
    if (b.t === "callout") {
      return '<div class="blk"><div class="callout"><h4>' + esc(b.label) +
             '</h4><div class="inner">' + field(base) + "</div></div></div>";
    }
    if (b.t === "rate") {
      let rows = "";
      b.items.forEach(function (it, i) {
        const k = base + "." + (i + 1);
        let btns = "";
        for (let v = 1; v <= 5; v++) {
          btns += '<button type="button" data-rk="' + k + '" data-v="' + v + '" aria-pressed="' +
                  (val(k) === String(v)) + '" aria-label="' + esc(it) + ": " + v + '">' + v + "</button>";
        }
        rows += '<div class="rrow" data-row="' + k + '"><div class="rname"><b>' + esc(it) +
                '</b></div><div class="rbtns" role="group" aria-label="' + esc(it) + '">' + btns + "</div></div>";
      });
      return '<div class="blk rate">' + (b.label ? "<h3>" + esc(b.label) + "</h3>" : "") + '<div class="scale"><span>1 Not me</span><span>5 That’s me</span></div>' +
             "<div>" + rows + "</div></div>";
    }
    return "";
  }

  /* Each page is a big title on the navy background with its white sheet under it.
     The first title is the page's h1. */
  function sheetHTML(page, i) {
    const h = i ? "h2" : "h1";
    return '<section class="pgsec">' +
      (page.title ? "<" + h + ' class="title">' + esc(page.title) + "</" + h + ">" : "") +
      '<article class="sheet" id="sheet-' + page.id + '">' +
      (page.rule ? '<p class="quote">' + esc(page.rule) + "</p>" : "") +
      (page.rule && page.rn ? '<p class="rule">Sandler Rule #' + page.rn + "</p>" : "") +
      '<div class="blocks">' + page.blocks.map(function (b) { return blockHTML(page, b); }).join("") + "</div>" +
      "</article></section>";
  }

  /* Paint the rating state, mark the top row(s) gold, and fill the callout
     with the top weakness until the person types their own answer. */
  function refreshRating() {
    document.querySelectorAll(".rbtns button").forEach(function (btn) {
      btn.setAttribute("aria-pressed", String(val(btn.dataset.rk) === btn.dataset.v));
    });
    const top = topRated();
    const r = rateBlock();
    if (r) {
      r.b.items.forEach(function (_, i) {
        const row = document.querySelector('.rrow[data-row="' + r.page.id + "." + r.b.k + "." + (i + 1) + '"]');
        if (row) row.classList.toggle("top", top.idx.indexOf(i) > -1);
      });
    }

    const ck = calloutKey();
    const input = ck && document.querySelector('input[data-fk="' + ck + '"]');
    if (!input) return;
    input.placeholder = top.names.length > 1 ? "It’s a tie. Pick one." : "Your highest number lands here";
    if (val(ck + ".mine")) return;           /* they wrote their own; leave it */
    const auto = top.names.length === 1 ? top.names[0] : "";
    if (input.value !== auto) {
      input.value = auto;
      ANSWERS[ck] = auto;
      saveAnswers();
    }
  }

  /* ---------- print sheets ---------- */

  function pTextBox(v) { return '<div class="ptext">' + esc(v) + "</div>"; }
  function pLines(base, n) {
    let li = "";
    for (let i = 1; i <= n; i++) li += '<div class="pline"><b>' + i + ".)</b><u>" + esc(val(base + "." + i)) + "</u></div>";
    return li;
  }

  function printBlock(page, b) {
    const base = page.id + "." + b.k;
    if (b.t === "num") return "<h3>" + esc(b.label) + "</h3>" + pLines(base, b.n);
    if (b.t === "split") {
      return '<div class="pgrid">' + b.cols.map(function (c) {
        return "<div><h3>" + esc(c[1]) + "</h3>" + pLines(base + "." + c[0], c[2]) + "</div>";
      }).join("") + "</div>";
    }
    if (b.t === "inline") {
      return '<div class="pline" style="margin:0"><b style="width:auto;color:#2e6db4;font-size:18px;font-weight:600">' +
             esc(b.label) + "</b><u>" + esc(val(base)) + "</u></div>";
    }
    if (b.t === "note") {
      return '<div class="pcall"><div class="pin" style="text-align:center;font-weight:600;min-height:0">' +
             esc(b.text) + "</div></div>";
    }
    if (b.t === "prompt") return "<h3>" + esc(b.label) + "</h3>" + pTextBox(val(base));
    if (b.t === "callout") {
      return '<div class="pcall"><h4>' + esc(b.label) +
             '</h4><div class="pin" style="text-align:center;font-weight:600;font-size:16px">' + esc(val(base)) + "</div></div>";
    }
    if (b.t === "rate") {
      const top = topRated();
      let rows = "";
      b.items.forEach(function (it, i) {
        const v = val(base + "." + (i + 1));
        let bx = "";
        for (let n = 1; n <= 5; n++) {
          const on = v === String(n);
          bx += '<span class="' + (on ? (top.idx.indexOf(i) > -1 ? "top" : "on") : "") + '">' + n + "</span>";
        }
        rows += '<div class="prow"><div class="pn"><b>' + esc(it) +
                '</b></div><div class="pbx">' + bx + "</div></div>";
      });
      return (b.label ? "<h3>" + esc(b.label) + "</h3>" : "") + '<div class="pscale"><span>1 Not me</span><span>5 That’s me</span></div><div>' + rows + "</div>";
    }
    return "";
  }

  function printSheet(page) {
    const d = document.createElement("div");
    d.className = "psheet";
    d.innerHTML =
      '<div class="pmark" style="background:url(' + LOGO_DARK + ') left center / contain no-repeat"></div>' +
      (page.title ? '<p class="ptitle">' + esc(page.title) + "</p>" : "") +
      (page.rule ? '<p class="pq">' + esc(page.rule) + "</p>" : "") +
      (page.rule && page.rn ? '<p class="pr">Sandler Rule #' + page.rn + "</p>" : "") +
      '<div class="pbody">' + page.blocks.map(function (b, i) {
        return (i ? '<i class="psp"></i>' : "") +
               '<div class="pblk' + (b.t === "prompt" ? " pgrow" : "") + '">' + printBlock(page, b) + "</div>";
      }).join("") + "</div>";
    return d;
  }

  /* ---------- PDF ---------- */

  let libs = null;
  function loadLibs() {
    if (libs) return libs;
    libs = new Promise(function (res, rej) {
      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
      ];
      let i = 0;
      (function nextScript() {
        if (i === urls.length) return res(true);
        const s = document.createElement("script");
        s.src = urls[i++];
        s.onload = nextScript;
        s.onerror = function () { libs = null; rej(new Error("offline")); };
        document.head.appendChild(s);
      })();
    });
    return libs;
  }

  /* html2canvas often hands back blank rows at the bottom; left in,
     they turn into an empty continuation page. */
  function trimBottom(canvas) {
    try {
      const ctx = canvas.getContext("2d");
      const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let last = -1;
      for (let y = canvas.height - 1; y >= 0 && last < 0; y--) {
        const row = y * canvas.width * 4;
        for (let x = 0; x < canvas.width; x++) {
          const p = row + x * 4;
          if (d[p] < 248 || d[p + 1] < 248 || d[p + 2] < 248) { last = y; break; }
        }
      }
      const keep = Math.min(canvas.height, (last < 0 ? 0 : last) + 40);
      if (keep > 0 && keep < canvas.height) {
        const c = document.createElement("canvas");
        c.width = canvas.width; c.height = keep;
        const cx = c.getContext("2d");
        cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(canvas, 0, 0);
        canvas.height = keep;
        ctx.drawImage(c, 0, 0);
      }
    } catch (e) { /* keep the full height */ }
  }

  async function makePDF() {
    const btn = $("dl"), hint = $("hint");
    btn.disabled = true;
    hint.textContent = "Building your PDF…";
    try {
      await loadLibs();
      const root = $("printroot");
      root.innerHTML = "";
      const nodes = PAGES.map(function (p) { const n = printSheet(p); root.appendChild(n); return n; });

      if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
      await new Promise(function (r) { setTimeout(r, 120); });

      const doc = new window.jspdf.jsPDF({ unit: "pt", format: "letter", compress: true });
      const M = 30, PW = 612, PH = 792, W = PW - M * 2, H = PH - M * 2;

      for (let i = 0; i < nodes.length; i++) {
        hint.textContent = "Building your PDF… page " + (i + 1) + " of " + nodes.length;
        const canvas = await window.html2canvas(nodes[i], {
          scale: 2, backgroundColor: "#ffffff", logging: false, useCORS: true, imageTimeout: 0
        });
        trimBottom(canvas);
        const ratio = canvas.width / W;
        const fullH = canvas.height / ratio;

        if (fullH <= H) {
          if (i) doc.addPage();
          doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M, M, W, fullH);
        } else if (fullH <= H * 1.3) {
          const h = H, w = W * (H / fullH);
          if (i) doc.addPage();
          doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", M + (W - w) / 2, M, w, h);
        } else {
          const sliceH = Math.floor(H * ratio);
          let y = 0, first = true;
          while (y < canvas.height) {
            const h = Math.min(sliceH, canvas.height - y);
            const c = document.createElement("canvas");
            c.width = canvas.width; c.height = h;
            const ctx = c.getContext("2d");
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
            if (i || !first) doc.addPage();
            doc.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", M, M, W, h / ratio);
            first = false;
            y += h;
          }
        }
      }

      doc.save(PDF_NAME);
      root.innerHTML = "";
      hint.textContent = "";
    } catch (e) {
      hint.textContent = "The PDF builder couldn’t load. Check your connection and try again.";
    }
    btn.disabled = false;
  }

  /* ---------- start ---------- */

  function grow(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }

  loadAnswers();
  $("sheets").innerHTML = PAGES.map(function (p, i) { return sheetHTML(p, i); }).join("");
  $("sheets").querySelectorAll("textarea.f").forEach(grow);
  refreshRating();

  document.addEventListener("input", function (e) {
    const el = e.target;
    if (!el || !el.dataset || !el.dataset.fk) return;
    ANSWERS[el.dataset.fk] = el.value;
    if (el.dataset.fk === calloutKey()) ANSWERS[el.dataset.fk + ".mine"] = el.value.trim() ? "1" : "";
    saveAnswers();
    if (el.tagName === "TEXTAREA") grow(el);
  });

  document.addEventListener("click", function (e) {
    const btn = e.target.closest && e.target.closest("button[data-rk]");
    if (!btn) return;
    const k = btn.dataset.rk;
    ANSWERS[k] = val(k) === btn.dataset.v ? "" : btn.dataset.v;   /* tap again to clear */
    saveAnswers();
    refreshRating();
  });

  window.addEventListener("resize", function () {
    $("sheets").querySelectorAll("textarea.f").forEach(grow);
  });

  $("dl").addEventListener("click", makePDF);
})();
</script>
</body>
</html>
